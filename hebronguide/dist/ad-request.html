<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Advertise — HebronGuide</title>
<meta name="description" content="Reach people who just arrived in your city. 막 도착한 사람에게 보입니다."/>
<meta property="og:title" content="Advertise — HebronGuide"/>
<meta property="og:description" content="Reach people who just arrived in your city."/>
<meta property="og:locale" content="en_US"/>
<meta property="og:locale:alternate" content="ko_KR"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
  :root{--bg:#0d1117;--bg2:#161b26;--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);
        --gold:#C9A227;--gold2:#F5C76E;--mint:#6EE7B7;--text:#ECFDF5;
        --muted:rgba(236,253,245,.62);--muted2:rgba(236,253,245,.4);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--text);
       line-height:1.8;padding-bottom:70px;word-break:keep-all;}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px;}

  .top{border-bottom:1px solid var(--line);}
  .top a{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;
         font-size:.88rem;padding:15px 20px;min-height:44px;}
  .top a:hover{color:var(--gold2);}

  header{padding:44px 0 20px;text-align:center;}
  h1{font-size:clamp(1.5rem,5vw,2rem);font-weight:500;line-height:1.4;}
  .sub{color:var(--muted);font-weight:300;margin-top:12px;font-size:.97rem;}

  .card{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:24px 22px;margin:16px 0;}

  .rows{display:grid;gap:10px;}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
       padding:13px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:0;}
  .row b{font-weight:500;font-size:1rem;}
  .row span{color:var(--gold2);font-weight:700;white-space:nowrap;}
  .row small{display:block;color:var(--muted2);font-size:.82rem;font-weight:300;margin-top:2px;}

  label{display:block;font-size:.88rem;color:var(--muted);margin:16px 0 7px;font-weight:300;}
  input,select,textarea{width:100%;background:#0b0f16;border:1px solid var(--line);border-radius:12px;
        padding:13px 15px;color:var(--text);font-family:inherit;font-size:1rem;}
  textarea{min-height:88px;resize:vertical;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:transparent;}

  .go{width:100%;background:var(--gold);color:#0d1117;border:0;border-radius:99px;
      padding:15px;font-family:inherit;font-size:1.02rem;font-weight:700;cursor:pointer;margin-top:22px;min-height:48px;}
  .go:disabled{background:var(--line2);color:var(--muted2);cursor:not-allowed;}
  .err{color:#FCA5A5;font-size:.88rem;margin-top:12px;line-height:1.7;}
  .hide{display:none;}

  .note{border-top:1px dashed var(--line);margin-top:20px;padding-top:16px;
        color:var(--muted);font-size:.86rem;font-weight:300;line-height:1.9;}
  .note b{color:var(--mint);font-weight:500;}

  .done{text-align:center;padding:26px 0;}
  .mark{width:56px;height:56px;border-radius:50%;background:rgba(110,231,183,.12);
        border:1px solid rgba(110,231,183,.4);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .foot{color:var(--muted2);font-size:.82rem;text-align:center;margin-top:22px;line-height:1.9;font-weight:300;}
  .foot a{color:var(--muted);}
</style>
</head>
<body>

<div class="top"><a href="/">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  HebronGuide</a></div>

<div class="wrap">

  <header>
    <h1 id="hd">광고 신청</h1>
    <p class="sub" id="hs">막 도착한 사람에게 보입니다.</p>
  </header>

  <!-- 값 — 설명 없이 숫자만 -->
  <section class="card" id="s0">
    <div class="rows">
      <div class="row">
        <b>도시 목록에 등재<small>교회 · 업소 · 기관</small></b>
        <span>무료</span>
      </div>
      <div class="row">
        <b>「이 도시 소식」에 노출<small>한 달</small></b>
        <span>$30</span>
      </div>
      <div class="row">
        <b>홈페이지 제작<small>나누리웹</small></b>
        <span>$299~</span>
      </div>
    </div>
    <div class="note">
      <b>순서는 돈이 정하지 않습니다.</b> 확인한 곳이 먼저입니다.<br>
      등재는 언제나 무료입니다. 내려 달라 하시면 바로 내립니다.
    </div>
  </section>

  <!-- 신청 — 네 칸 -->
  <section class="card" id="s1">
    <label for="f1">이름 또는 상호</label>
    <input id="f1" autocomplete="organization" placeholder="헤브론식당 · 김헤브론"/>

    <label for="f2">도시</label>
    <input id="f2" placeholder="시애틀"/>

    <label for="f3">연락처</label>
    <input id="f3" placeholder="카카오톡 ID · 전화번호 · 이메일"/>

    <label for="f4">무엇을 하시나요?</label>
    <select id="f4">
      <option value="등재">도시 목록에 등재 (무료)</option>
      <option value="소식">「이 도시 소식」 노출 ($30/월)</option>
      <option value="홈페이지">홈페이지 제작 ($299~)</option>
      <option value="모르겠음">아직 모르겠습니다</option>
    </select>

    <label for="f5">하실 말씀 <span style="color:var(--muted2)">— 없으셔도 됩니다</span></label>
    <textarea id="f5" placeholder="가게 소개, 궁금한 것, 무엇이든"></textarea>

    <button class="go" id="go" type="button">보내기</button>
    <div class="err hide" id="er"></div>

    <div class="note">
      <b>48시간 안에</b> 연락드립니다.<br>
      <b>연락처는 공개되지 않습니다.</b>
    </div>
  </section>

  <!-- 끝 -->
  <section class="card hide" id="s2">
    <div class="done">
      <div class="mark"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#6EE7B7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg></div>
      <div style="font-size:1.1rem;font-weight:500;margin-bottom:8px;">받았습니다</div>
      <p class="sub" style="margin-top:0;">48시간 안에 연락드리겠습니다.</p>
    </div>
  </section>

  <p class="foot">
    <a href="/hospitality-board.html">게시판</a> &nbsp;·&nbsp;
    <a href="/faq.html">자주 묻는 질문</a>
  </p>

</div>

<script>
document.getElementById('go').onclick = async function(){
  var btn = this, er = document.getElementById('er');
  var name = document.getElementById('f1').value.trim();
  var city = document.getElementById('f2').value.trim();
  var cont = document.getElementById('f3').value.trim();
  var what = document.getElementById('f4').value;
  var msg  = document.getElementById('f5').value.trim();
  er.classList.add('hide');
  if(!name || !city || !cont){
    er.textContent = '이름 · 도시 · 연락처, 셋만 채워 주시면 됩니다.';
    er.classList.remove('hide'); return;
  }
  btn.disabled = true; btn.textContent = '보내는 중…';
  var isMail = cont.indexOf('@') > -1;
  try{
    var r = await fetch('/api/submit-form', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        type: 'ad',
        name: name,
        city: city,
        email: isMail ? cont : '',
        phone: isMail ? '' : cont,
        subject: '[광고] ' + name + ' · ' + city + ' · ' + what,
        body: ['이름: ' + name, '도시: ' + city, '연락처: ' + cont,
               '무엇: ' + what, '', (msg || '(없음)')].join('\n')
      })
    });
    var j = await r.json().catch(function(){ return {}; });
    if(!r.ok) throw new Error(j.error || ('보내지 못했습니다 (' + r.status + ')'));
    document.getElementById('s0').classList.add('hide');
    document.getElementById('s1').classList.add('hide');
    document.getElementById('s2').classList.remove('hide');
    document.getElementById('hd').textContent = '고맙습니다';
    document.getElementById('hs').textContent = '';
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(e){
    // 안 보내졌는데 보냈다고 하지 않는다
    er.textContent = (e.message || '보내지 못했습니다') +
      ' · hebronplatform@gmail.com 으로 보내 주셔도 됩니다.';
    er.classList.remove('hide');
    btn.disabled = false; btn.textContent = '보내기';
  }
};
</script>
</body>
</html>
