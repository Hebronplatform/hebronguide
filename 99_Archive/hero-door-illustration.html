<!-- 2026-09-23 첫 화면에서 뺀 문 그림. 되살리려면 .hero 안 hero-pre 앞에 넣으면 된다. -->
  <!-- 헤브론 환대의 문 — 클릭하면 도시로 들어가는 입구 (나니아의 옷장처럼) -->
  <button type="button" class="hero-door" id="heroDoor" aria-label="도시 검색 열기">
  <svg viewBox="0 0 460 250" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="hebDoorway">
        <path d="M202 216 V120 Q202 94 230 94 Q258 94 258 120 V216 Z"/>
      </clipPath>
      <linearGradient id="hebSky" x1="230" y1="94" x2="230" y2="216" gradientUnits="userSpaceOnUse">
        <stop stop-color="#7ec8ef"/>
        <stop offset=".52" stop-color="#c2e7fa"/>
        <stop offset="1" stop-color="#f6fcff"/>
      </linearGradient>
      <linearGradient id="hebBeam" x1="230" y1="86" x2="230" y2="216" gradientUnits="userSpaceOnUse">
        <stop stop-color="#fffdf5" stop-opacity=".97"/>
        <stop offset=".55" stop-color="#ffe9b8" stop-opacity=".55"/>
        <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <!-- 인도하는 별 -->
    <path class="heb-star" d="M230 22 l4.5 13 13 4.5 -13 4.5 -4.5 13 -4.5 -13 -13 -4.5 13 -4.5z" fill="#c07f0a"/>
    <!-- 땅 선 -->
    <path d="M44 216 H416" stroke="#8a5f10" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>

    <g class="heb-city">
      <path d="M278 216 L308 166 L338 216" stroke="#3f86b5" stroke-opacity=".42" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M297 185 L302 179 L307 184 L312 178 L319 185" stroke="#3f86b5" stroke-opacity=".62" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>

      <path d="M354 216 V158 H364 V216" stroke="#0f7a5a" stroke-opacity=".75" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M368 216 V182 H378 V216" stroke="#0f7a5a" stroke-opacity=".75" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

      <path d="M398 216 V172" stroke="#0f7a5a" stroke-opacity=".85" stroke-width="2" stroke-linecap="round"/>
      <path d="M391 216 Q398 192 405 216" stroke="#0f7a5a" stroke-opacity=".5" stroke-width="1.5"/>
      <ellipse cx="398" cy="169" rx="11" ry="3.8" stroke="#0f7a5a" stroke-opacity=".85" stroke-width="2"/>
      <path d="M398 164 V150" stroke="#0f7a5a" stroke-opacity=".85" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- 문 너머 — 푸른 하늘과 구름 -->
    <g class="heb-sky" clip-path="url(#hebDoorway)">
      <rect x="196" y="86" width="68" height="134" fill="url(#hebSky)"/>
      <circle cx="212" cy="115" r="8.5" fill="#ffffff" fill-opacity=".9"/>
      <path d="M238 130 q3.5 -5.5 9 -2 q4.5 -5 8.5 1.5 q4 1 2 4.5 h-21 q-2.5 -2.5 1.5 -4z" fill="#ffffff" fill-opacity=".92"/>

      <path d="M196 198 H264" stroke="#5ba3cf" stroke-opacity=".38" stroke-width="1.4"/>
    </g>
    <!-- 문에서 쏟아지는 빛 -->
    <path class="heb-beam" d="M208 88 L252 88 L296 216 L96 216 Z" fill="url(#hebBeam)"/>
    <!-- 환대의 아치 문 -->
    <path d="M190 216 V118 Q190 80 230 80 Q270 80 270 118 V216" stroke="#7a4f0a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M202 216 V120 Q202 94 230 94 Q258 94 258 120 V216" stroke="#7a4f0a" stroke-opacity=".45" stroke-width="1.6"/>

    <g class="heb-leaf">
      <path d="M202 216 L166 202 V96 L202 106" stroke="#a86c0c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M184 110 V198" stroke="#a86c0c" stroke-opacity=".5" stroke-width="1.4"/>
    </g>
    <!-- 맞이하는 사람 — 팔 벌려 손 흔들며 웃는 얼굴 -->
    <g class="heb-welcome">
      <circle cx="234" cy="132" r="8.5" stroke="#241704" stroke-width="2.2" fill="#ffffff" fill-opacity=".5"/>
      <circle cx="231" cy="130.4" r="1.05" fill="#241704"/>
      <circle cx="237" cy="130.4" r="1.05" fill="#241704"/>
      <path d="M230.6 134.6 Q234 138.4 237.4 134.6" stroke="#241704" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M234 141 V180 M234 180 L225 205 M234 180 L243 205 M234 152 L220 166" stroke="#241704" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="heb-wave" d="M234 152 L250 139" stroke="#241704" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <!-- 도착하는 나그네 — 여행 가방, 웃는 얼굴 -->
    <g class="heb-traveler">
      <circle cx="118" cy="150" r="7.5" stroke="#0f7a5a" stroke-width="2.2" fill="#ffffff" fill-opacity=".45"/>
      <circle cx="115.6" cy="148.7" r=".95" fill="#0f7a5a"/>
      <circle cx="120.6" cy="148.7" r=".95" fill="#0f7a5a"/>
      <path d="M115.3 152.4 Q118 155.6 120.9 152.4" stroke="#0f7a5a" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M118 158 V187 M118 168 L108 158 M118 168 L129 174 M118 187 L110 209 M118 187 L126 209" stroke="#0f7a5a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="129" y="174" width="13" height="13" rx="2" stroke="#0f7a5a" stroke-width="1.9"/>
      <path d="M133 174 v-3 h5 v3" stroke="#0f7a5a" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <!-- 나그네 → 문으로 이어지는 길 -->
    <path d="M118 216 C152 210 170 212 190 216" stroke="#7a4f0a" stroke-opacity=".5" stroke-width="1.6" stroke-dasharray="1.5 8" stroke-linecap="round"/>
  </svg>
  <span class="hero-door-hint"><span class="ko">문을 클릭하세요</span><span class="en">Click the door</span></span>
  </button>
